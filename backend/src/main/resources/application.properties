spring.application.name=backend

#?????
server.port=8080

# 时区配置
spring.jackson.time-zone=Asia/Shanghai
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# 数据库配置
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sailtrack}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# 邮件服务配置
spring.mail.host=${MAIL_HOST:smtp.163.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=true

# 阿里云配置（人脸识别和OSS）
# 请在阿里云控制台获取 AccessKey：https://ram.console.aliyun.com/manage/ak
aliyun.access-key-id=${ALIYUN_ACCESS_KEY_ID:}
aliyun.access-key-secret=${ALIYUN_ACCESS_KEY_SECRET:}
aliyun.oss.bucket-name=${ALIYUN_OSS_BUCKET_NAME:}
aliyun.oss.endpoint=${ALIYUN_OSS_ENDPOINT:oss-cn-hongkong.aliyuncs.com}
aliyun.facebody.endpoint=${ALIYUN_FACEBODY_ENDPOINT:facebody.cn-shanghai.aliyuncs.com}

# 人脸识别相似度阈值（0-100，建议80）
face.recognition.threshold=${FACE_RECOGNITION_THRESHOLD:80.0}


